name: Deploy Vite app to GitHub Pages

on:
  push:
    branches:
      - main          # если ваша основная ветка называется master, замените на master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22   # используем актуальную LTS версию

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: npm run build    # для Vite это обычно сборка в папку dist

      - name: List files after build (отладка)
        run: ls -la           # проверим, что папка dist появилась

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'      # Vite по умолчанию создаёт папку dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
